<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rahasya OSINT Report</title>
    <style>
        body {
            background-color: #0a0e17;
            color: #e2e8f0;
            font-family: 'Arial', sans-serif;
            margin: 40px;
        }
        h1, h2, h3 {
            color: #00d4ff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background-color: #111827;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rahasya Intelligence Report</h1>
        <div class="card">
            <h2>Executive Summary</h2>
            <p>Target overview and primary risk assessment.</p>
        </div>
        <div class="card">
            <h2>Entity List</h2>
            <table>
                <tr>
                    <th>Type</th>
                    <th>Value</th>
                </tr>
                <tr>
                    <td>EMAIL</td>
                    <td>target@example.com</td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
