    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#8b5cf6", "font": {"color": "#e2e8f0"}, "id": "n1", "label": "John Doe", "shape": "dot", "size": 20, "title": "Target"}, {"color": "#00d4ff", "font": {"color": "#e2e8f0"}, "id": "n2", "label": "johndoe@example.com", "shape": "dot", "size": 20, "title": "Breached Email"}, {"color": "#10b981", "font": {"color": "#e2e8f0"}, "id": "n3", "label": "+1234567890", "shape": "dot", "size": 20, "title": "Registered Phone"}, {"color": "#f59e0b", "font": {"color": "#e2e8f0"}, "id": "n4", "label": "johndoe99", "shape": "dot", "size": 20, "title": "Twitter Handle"}, {"color": "#ec4899", "font": {"color": "#e2e8f0"}, "id": "n5", "label": "LinkedIn Profile", "shape": "dot", "size": 20, "title": "LinkedIn"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "n1", "title": "Used in", "to": "n2", "width": 3}, {"arrows": "to", "from": "n1", "title": "Owned by", "to": "n3", "width": 3}, {"arrows": "to", "from": "n1", "title": "Alias", "to": "n4", "width": 2.4000000000000004}, {"arrows": "to", "from": "n4", "title": "Linked account", "to": "n5", "width": 1.7999999999999998}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "forceAtlas2Based": {
            "avoidOverlap": 0,
            "centralGravity": 0.01,
            "damping": 0.4,
            "gravitationalConstant": -50,
            "springConstant": 0.08,
            "springLength": 100
        },
        "solver": "forceAtlas2Based",
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
